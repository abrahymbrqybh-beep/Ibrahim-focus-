${TSC()}<div class="c"><button class="btn y" onclick="tab='m';R()" style="width:100%">🛒 متجر المكافآت — 🪙 ${coins()}</button></div><div class="c"><h3>🎖️ الشارات ${c}/100</h3>${nx>=0?`<small>التالية: ${NM[nx]} عند ${BH(nx+1)} ساعة</small>`:'<small>أنت أسطورة! 💀</small>'}<div class="bd" style="margin-top:8px">${NM.map((n,i)=>`<div class="bg ${u[i]?'':'lk'}"><b>${u[i]?(i==99?'💀':EM[i%10]):'🔒'}</b>${i+1}. ${n}<br>${BH(i+1)}س</div>`).join('')}</div></div>

{const hm=new Date().toTimeString().slice(0,5),td=D(),mn=x=>+x.slice(0,2)*60+ +x.slice(3,5);if(S.nfd!=td){S.nf={};S.nfd=td}(S.rem||'09:00,12:00,15:00,18:00,21:00').split(',').map(x=>x.trim()).forEach((t,i)=>{if(/^\d\d:\d\d$/.test(t)&&hm>=t&&mn(hm)-mn(t)<=90&&!S.nf[t]){S.nf[t]=1;const L=S.tasks.filter(x=>x.date==td&&!x.done),tk=i%2==0&&L.length;nt(tk?'📋 مهام اليوم':'💡 تحفيز',tk?'باقي '+L.length+' مهام: '+L.slice(0,3).map(x=>x.title).join('، '):TIP(Math.floor(Date.now()/864e5+i)%150));save()}})}}
