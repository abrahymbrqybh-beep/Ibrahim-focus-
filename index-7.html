return`<div class="c"><h3>📂 افتح ملف امتحان</h3><select id="fsb">${SUB.map(s=>`<option>${s}</option>`).join('')}</select><label class="btn" style="display:block;text-align:center;margin:6px 0">اختر ملف الامتحان<input type="file" accept=".txt,.docx,.md" onchange="ldf(event)" style="display:none"></label><small>ملف Word أو نصي: الأسئلة ثم قسم «الإجابات». يفتح الامتحان فورًا.</small></div><div class="c"><h3>❓ بنك الأسئلة</h3>${SUB.map(s=>`<div class="row"><div><b>${s}</b><br><small>${(S.qs[s]||[]).length} سؤال</small></div><button class="btn s" ${(S.qs[s]||[]).length?'':'disabled'} onclick="startQ('${s}')">ابدأ</button><button class="btn s b" onclick="clrQ('${s}')">🗑</button></div>`).join('')}</div>

{const hm=new Date().toTimeString().slice(0,5),td=D(),mn=x=>+x.slice(0,2)*60+ +x.slice(3,5);if(S.nfd!=td){S.nf={};S.nfd=td}(S.rem||'09:00,12:00,15:00,18:00,21:00').split(',').map(x=>x.trim()).forEach((t,i)=>{if(/^\d\d:\d\d$/.test(t)&&hm>=t&&mn(hm)-mn(t)<=90&&!S.nf[t]){S.nf[t]=1;const L=S.tasks.filter(x=>x.date==td&&!x.done),tk=i%2==0&&L.length;nt(tk?'📋 مهام اليوم':'💡 تحفيز',tk?'باقي '+L.length+' مهام: '+L.slice(0,3).map(x=>x.title).join('، '):TIP(Math.floor(Date.now()/864e5+i)%150));save()}})}}
